version: '3'
services:
  db:
    image: postgres
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: jongseoung
      POSTGRES_PASSWORD: postgres
    container_name: POSTGRES_DB
    
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
    restart: always
    container_name: Backend
