name: GitHub Actions Test

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 체크아웃
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Python 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.6'

      # 3. 테스트 실행
      - name: Run Tests
        run: |
          echo "GitHub Actions 테스트가 성공적으로 실행되었습니다!"
